<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOS Button</title>
  <style>
    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .sos-button {
      width: 120px;
      height: 120px;
      background-color: #ff0000;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 0 rgba(255, 0, 0, 0.7);
      transition: transform 0.3s ease;
    }

    .sos-button:active {
      transform: scale(0.5);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
      }
      70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 25px rgba(255, 0, 0, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
      }
    }
  </style>
</head>
<body>

  <button class="sos-button" onclick="sendSOS()">SOS</button>

  <script>
    function sendSOS() {
      alert("🚨 SOS Alert Sent!");

      // TODO: Replace with actual logic (API call, email, SMS, etc.)
      // Example:
      // fetch('https://your-backend.com/sos', { method: 'POST', body: JSON.stringify({ userId: 123 }) })
    }
  </script>

</body>
</html>
