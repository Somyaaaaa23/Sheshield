name: sheshield
description: A women safety app with emergency SOS features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.0+1
  twilio_flutter: ^0.9.0
  flutter_email_sender: ^7.0.0
  camera: ^0.11.1
  path_provider: ^2.1.1
  speech_to_text: ^7.0.0
  intl: ^0.19.0
  firebase_core: ^3.13.1
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.3.2
  flutter_secure_storage: ^9.0.0
  supabase_flutter: ^2.3.1
  image_picker: ^1.0.5
  google_sign_in: ^6.2.1
  mailer: ^6.4.1
  google_generative_ai: ^0.4.7  
  firebase_database: ^11.3.6
  url_launcher: ^6.2.0
  sensors_plus: ^6.1.1
  flutter_svg: ^2.0.9
  sqflite: ^2.4.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  google_maps_flutter: ^2.8.0
  google_maps_cluster_manager: ^3.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  telephony: ^0.2.0
  geofence_service: ^6.0.0+1
  flutter_activity_recognition: ^3.1.0
  flutter_foreground_task: ^9.1.0 # Or the latest stable version
  flutter_local_notifications: ^16.3.2
  showcaseview: ^4.0.1
  csv: ^5.0.2
  video_compress: ^3.1.2
  easy_localization: ^3.0.1

  flutter_localizations:
    sdk: flutter
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env 
    - assets/illustrations/
    - assets/translations/
    - assets/crime_data.csv
    - assets/lang/en.json
    - assets/lang/hi.json